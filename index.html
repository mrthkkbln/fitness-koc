<title>Fitness Koç</title>

html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

.mut{color:var(--tx2);font-size:15px}.sm{font-size:15px}.xs{font-size:14px;color:var(--tx3)}

button.pr{background:var(--ac);color:#fff;border:none}button.full{width:100%}button.sm{min-height:38px;font-size:14px;padding:0 12px}

input.n{width:80px;min-height:52px;padding:6px;text-align:center;font-size:20px;font-weight:600}
input::placeholder{color:#c0c4cc;font-weight:400}
label.l{display:block;font-size:15px;color:var(--tx2);margin:14px 0 6px;font-weight:500}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.f1{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hr{border-top:1px solid var(--bd);margin:12px 0}
.ex{padding:12px 0;border-top:1px solid var(--bd)}
.set{display:flex;align-items:center;gap:10px;margin-top:10px}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--acbg);color:var(--ac)}
.ban{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.err{color:var(--er);font-size:15px;margin-top:8px;min-height:1px}
.bar{height:8px;background:var(--bd);border-radius:4px}.bar>div{height:8px;background:var(--ac);border-radius:4px}
.tip{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;font-size:15px}
.step{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.step .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--bd);color:var(--tx2);flex:none}
.step.done .dot{background:var(--ok);color:#fff}
a{color:var(--ac);text-decoration:none;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:9}
nav a{flex:1;text-align:center;font-size:12px;font-weight:500;color:var(--tx3);padding:2px 0}nav a.on2{color:var(--ac);font-weight:700}nav svg{display:block;margin:0 auto 2px;width:26px;height:26px}
.ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--bd)}
svg text{fill:var(--tx3);font-size:11px}
.hide{display:none}
.shw{display:flex;gap:10px;align-items:flex-start;margin-top:8px}.shl{flex:0 0 40%;position:sticky;top:calc(8px + env(safe-area-inset-top));align-self:flex-start}.shr{flex:1;min-width:0}.shk{margin-bottom:4px}.shk .xs{font-size:12px}.shl .xs{font-size:11px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
input[type=range]{min-height:34px;padding:0;border:0;background:transparent;accent-color:var(--ac)}
button:disabled{opacity:.45}
details summary{list-style:revert}
</style>
</head>

const CH={};

function chart(series,id,unit){if(series.length<2)return `<div class="xs" style="margin-top:8px">Grafik için seçili aralıkta en az 2 ölçüm gerekiyor.</div>`;
 const W=340,H=160,L=34,R=8,T=12,B=26,vs=series.map(s=>s[1]),mn=Math.min(...vs),mx=Math.max(...vs),pad=((mx-mn)||1)*.15,lo=mn-pad,hi=mx+pad,t0=series[0][2],t1=series[series.length-1][2],span=(t1-t0)||1;
 const pts=series.map(s=>[L+(s[2]-t0)/span*(W-L-R),T+(H-T-B)*(1-(s[1]-lo)/(hi-lo))]);

 return `<svg id="${id}" viewBox="0 0 ${W} ${H}" width="100%" style="touch-action:none;user-select:none;margin-top:8px;cursor:ew-resize" role="img" aria-label="Grafik">
 <rect id="${id}-band" x="${pts[st.a][0]}" y="${T-4}" width="${Math.max(0,pts[st.b][0]-pts[st.a][0])}" height="${H-B-T+4}" fill="var(--acbg)"/>
 <polyline fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--ac)"/>`).join('')}
 <text x="0" y="${T+8}">${fmt(hi)}</text><text x="0" y="${H-B}">${fmt(lo)}</text><text x="${L}" y="${H-6}">${dmy(series[0][0])}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dmy(series[series.length-1][0])}</text>
 ${ln('a','#0f766e')}${ln('b','#0f766e')}</svg><div id="${id}-info" class="sm" style="margin-top:6px;font-weight:600">${chInfo(id)}</div><div class="xs">Çizgileri parmağınla sürükleyerek aralık seç.</div>`}

 const upd=()=>{const c=CH[id],st=ui.ch[id];['a','b'].forEach(k=>{const p=c.pts[st[k]];const l=document.getElementById(id+'-'+k),cc=document.getElementById(id+'-'+k+'c');l.setAttribute('x1',p[0]);l.setAttribute('x2',p[0]);cc.setAttribute('cx',p[0]);cc.setAttribute('cy',p[1])});

 svg.addEventListener('pointerdown',ev=>{const i=idx(ev),st=ui.ch[id];drag=Math.abs(i-st.a)<=Math.abs(i-st.b)?'a':'b';if(st.a===st.b)drag=i<st.a?'a':'b';svg.setPointerCapture(ev.pointerId);st[drag]=i;if(st.a>st.b){const t=st.a;st.a=st.b;st.b=t;drag=drag==='a'?'b':'a'}upd()});

function compress(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',max>400?.82:.7))};img.onerror=rej;img.src=u})}

/* ---------- bağlantı kodu ---------- */
function applyCode(tx){tx=String(tx||'').trim();let url='',tok='';
 if(tx.startsWith('FKOC|')){const p=tx.split('|');url=p[1];tok=p[2]}
 else{const m=tx.match(/https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/);const t=tx.match(/\b[a-f0-9]{32}\b/);url=m?m[0]:'';tok=t?t[0]:''}
 if(!url&&!tok)return false;if(url)S.cfg.url=url.trim();if(tok)S.cfg.token=tok.trim();save();ui.serr=(url&&tok?'Adres ve kod alındı ✓':url?'Adres alındı ✓':'Kod alındı ✓')+' Şimdi "Bağlantıyı test et".';flush();return true}
/* ---------- kamerayla token okuma (OCR) ---------- */
function hexToken(text){const ws=String(text||'').toLowerCase().replace(/[^0-9a-f\s]/g,'').split(/\s+/).filter(Boolean);
 const ex=ws.find(w=>w.length===32);if(ex)return {tok:ex,sure:true};
 for(let i=0;i<ws.length;i++){let s='';for(let j=i;j<ws.length&&s.length<32;j++){s+=ws[j];if(s.length===32)return {tok:s,sure:true}}}
 const best=ws.sort((a,b)=>Math.abs(a.length-32)-Math.abs(b.length-32))[0]||'';return best.length>=28?{tok:best,sure:false}:null}
function loadTess(){return window.Tesseract?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('OCR yüklenemedi (internet?)'));document.head.appendChild(s)})}
let scanStream=null,scanOn=false,tessW=null;
function loadJsQR(){return window.jsQR?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=res;s.onerror=()=>rej(new Error('okuyucu yüklenemedi'));document.head.appendChild(s)})}
async function getWorker(){await loadTess();if(!tessW){tessW=await Tesseract.createWorker('eng');await tessW.setParameters({tessedit_char_whitelist:'0123456789abcdef'})}return tessW}

  const v=document.getElementById('qv');v.srcObject=scanStream;await v.play();await loadJsQR().catch(()=>{});const w=await getWorker(),c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true}),c2=document.createElement('canvas'),x2=c2.getContext('2d',{willReadFrequently:true});let tries=0;
  while(scanOn){if(!v.videoWidth){await new Promise(r=>setTimeout(r,200));continue}
   if(window.jsQR){const k=Math.min(1,960/v.videoWidth);c2.width=v.videoWidth*k;c2.height=v.videoHeight*k;x2.drawImage(v,0,0,c2.width,c2.height);const q=window.jsQR(x2.getImageData(0,0,c2.width,c2.height).data,c2.width,c2.height);

   const sw=v.videoWidth,sh=v.videoHeight*.28,sx=0,sy=v.videoHeight*.36,sc=Math.min(1,1400/sw);c.width=sw*sc;c.height=sh*sc;x.filter='grayscale(1) contrast(1.4)';x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
   const r=await w.recognize(c);if(!scanOn)break;const t=hexToken(r.data.text),qs=document.getElementById('qs');tries++;

   if(qs)qs.textContent=tries>8?'Okuyamıyorum: telefonu yaklaştır, ekranı düz tut, parlamayı azalt.':'Okunuyor…'+(t?' ('+t.tok.length+'/32 karakter)':'')}}
 catch(e){stopScan();ui.serr='Kamera açılamadı: '+e.message+'. iPhone Ayarlar > Safari > Kamera iznini kontrol et ya da "Fotoğraftan oku"yu kullan.';render()}}
