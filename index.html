.hr{border-top:1px solid var(--bd);margin:12px 0}
.ex{padding:12px 0;border-top:1px solid var(--bd)}
.set{display:flex;align-items:center;gap:10px;margin-top:10px}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--acbg);color:var(--ac)}

a{color:var(--ac);text-decoration:none;font-weight:600}

 for(const a of xs){const al=w.act[a].d.filter(i=>w.td.includes(i));opt[a]=[];for(let m=0;m<128;m++){if(pc(m)===w.act[a].n&&ALL.every(i=>!(m>>i&1)||al.includes(i)))opt[a].push(m)}}
 const ord=[...xs].sort((a,b)=>opt[a].length-opt[b].length),pick={};let best=null,bs=1e9,it=0;
 const ok=()=>{for(const p of w.no){const[a,b]=p.split('|');if(pick[a]!=null&&pick[b]!=null&&(pick[a]&pick[b]))return false}for(let i=0;i<7;i++){let c=0;for(const a in pick)c+=pick[a]>>i&1;if(c>2)return false}return true};
 const nW=w.act.Ağırlık.on?w.act.Ağırlık.n:0,labs=labelsFor(nW);
 (function go(k){if(++it>400000)return;
  if(k===ord.length){const W=pick.Ağırlık||0,H=HARD.reduce((m,a)=>m|(pick[a]||0),0);let s=0,j=0;const leg=[];
   for(let i=0;i<7;i++){leg[i]=false;if(W>>i&1){leg[i]=/^Alt|^Tüm/.test(labs[j]);j++}}
   for(let i=0;i<7;i++){const n=(i+1)%7;let c=0;for(const a in pick)c+=pick[a]>>i&1;
    if((W>>i&1)&&(W>>n&1))s+=3;
    if(leg[i]&&(H>>n&1))s+=4;
    if(leg[i]&&(H>>i&1))s+=5;
    if((W>>i&1)&&(H>>i&1))s+=i<5?6:1;
    if(c>1)s+=i<5?6:2;
    if(leg[i]&&leg[n])s+=4}
   if(s<bs){bs=s;best={...pick}}return}
  const a=ord[k];for(const m of opt[a]){pick[a]=m;if(ok())go(k+1);delete pick[a]}})(0);
 if(!best)return null;
 const r=D.map(()=>[]);let j=0;
 for(let i=0;i<7;i++)AL.forEach(a=>{if(best[a]!=null&&(best[a]>>i&1))r[i].push(a==='Ağırlık'?'Ağırlık · '+labs[j++]:a)});

 slots.forEach((s,i)=>{const key=label+'|'+i;let id=s[3]||S.swap[key];if(id&&(!EX[id]||S.ban.includes(id)))id=null;if(!id)id=pick(s[0],s[1],s[2],used);if(!id)return;used.push(id);

 ui.werr='';const rpe=num(dr.rpe),res=progress(items,dr.sets,rpe),act=planned||('Ağırlık · '+label),note=planned&&planned!=='Ağırlık · '+label?'Yerine: '+label:'';

 const lines=res.map(o=>o.bw?`${o.tag==='artır'?'↑':'→'} ${EX[o.ex].n}: ${o.tag==='artır'?'tekrarları artır ya da ağırlık ekle':'hedef tekrara ulaşana kadar devam'}`:`${o.tag==='artır'?'↑':o.tag==='düşür'?'↓':'→'} ${EX[o.ex].n}: gelecek sefer ${fmt(o.nw)} kg`);

 if(res.some(o=>o.tag==='düşür'))lines.push('İki kez üst üste hedefin altında kalınca %10 hafifletiyoruz; tekniği sağlamlaştırıp tekrar çıkacağız.');

function compress(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',max>400?.82:.7))};img.onerror=rej;img.src=u})}

/* ---------- bağlantı kodu ---------- */
function applyCode(tx){tx=String(tx||'').trim();let url='',tok='';
 if(tx.startsWith('FKOC|')){const p=tx.split('|');url=p[1];tok=p[2]}
 else{const m=tx.match(/https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/);const t=tx.match(/\b[a-f0-9]{32}\b/);url=m?m[0]:'';tok=t?t[0]:''}
 if(!url&&!tok)return false;if(url)S.cfg.url=url.trim();if(tok)S.cfg.token=tok.trim();save();ui.serr=(url&&tok?'Adres ve kod alındı ✓':url?'Adres alındı ✓':'Kod alındı ✓')+' Şimdi "Bağlantıyı test et".';flush();return true}
/* ---------- kamerayla token okuma (OCR) ---------- */
function hexToken(text){const ws=String(text||'').toLowerCase().replace(/[^0-9a-f\s]/g,'').split(/\s+/).filter(Boolean);
 const ex=ws.find(w=>w.length===32);if(ex)return {tok:ex,sure:true};
 for(let i=0;i<ws.length;i++){let s='';for(let j=i;j<ws.length&&s.length<32;j++){s+=ws[j];if(s.length===32)return {tok:s,sure:true}}}
 const best=ws.sort((a,b)=>Math.abs(a.length-32)-Math.abs(b.length-32))[0]||'';return best.length>=28?{tok:best,sure:false}:null}
function loadTess(){return window.Tesseract?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('OCR yüklenemedi (internet?)'));document.head.appendChild(s)})}
let scanStream=null,scanOn=false,tessW=null;
function loadJsQR(){return window.jsQR?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=res;s.onerror=()=>rej(new Error('okuyucu yüklenemedi'));document.head.appendChild(s)})}
async function getWorker(){await loadTess();if(!tessW){tessW=await Tesseract.createWorker('eng');await tessW.setParameters({tessedit_char_whitelist:'0123456789abcdef'})}return tessW}
function stopScan(){scanOn=false;if(scanStream)scanStream.getTracks().forEach(t=>t.stop());scanStream=null;const b=document.getElementById('scanbox');if(b)b.innerHTML=''}
async function scanCode(){const box=document.getElementById('scanbox');if(!box||scanOn)return;
 try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});scanOn=true;
  box.innerHTML='<div style="position:relative;margin-top:10px;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:12px;background:#000"><video id="qv" playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video><div style="position:absolute;left:10%;right:10%;top:50%;transform:translateY(-50%);aspect-ratio:1/1;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)"></div></div><div class="xs" id="qs" style="margin-top:6px">Kare kodu çerçevenin içine getir… (ilk açılışta biraz bekleyebilir)</div><button class="full" style="margin-top:6px" data-a="scanX">Kapat</button>';
  const v=document.getElementById('qv');v.srcObject=scanStream;await v.play();await loadJsQR().catch(()=>{});const w=await getWorker(),c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true}),c2=document.createElement('canvas'),x2=c2.getContext('2d',{willReadFrequently:true});let tries=0;
  while(scanOn){if(!v.videoWidth){await new Promise(r=>setTimeout(r,200));continue}
   if(window.jsQR){const k=Math.min(1,960/v.videoWidth);c2.width=v.videoWidth*k;c2.height=v.videoHeight*k;x2.drawImage(v,0,0,c2.width,c2.height);const q=window.jsQR(x2.getImageData(0,0,c2.width,c2.height).data,c2.width,c2.height);
    if(q&&q.data&&q.data.startsWith('FKOC|')){stopScan();applyCode(q.data);ui.serr='Adres ve kod okundu ✓ Şimdi "Bağlantıyı test et".';render();return}}
   const sw=v.videoWidth,sh=v.videoHeight*.28,sx=0,sy=v.videoHeight*.36,sc=Math.min(1,1400/sw);c.width=sw*sc;c.height=sh*sc;x.filter='grayscale(1) contrast(1.4)';x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
   const r=await w.recognize(c);if(!scanOn)break;const t=hexToken(r.data.text),qs=document.getElementById('qs');tries++;
   if(t&&t.sure){stopScan();S.cfg.token=t.tok;save();ui.serr='Kod okundu ✓'+(urlProblem()&&urlProblem()!=='TOKEN boş.'?' Adres okunmadı: telefonu Sheets penceresinin tamamına tut, tekrar okut.':' Şimdi "Bağlantıyı test et".');flush();render();return}
   if(qs)qs.textContent=tries>8?'Okuyamıyorum: telefonu yaklaştır, ekranı düz tut, parlamayı azalt.':'Okunuyor…'+(t?' ('+t.tok.length+'/32 karakter)':'')}}
 catch(e){stopScan();ui.serr='Kamera açılamadı: '+e.message+'. iPhone Ayarlar > Safari > Kamera iznini kontrol et ya da "Fotoğraftan oku"yu kullan.';render()}}
async function ocrToken(file){ui.serr='Okunuyor… ilk seferde 10–20 sn sürebilir.';render();

  const t=hexToken(r.data.text);
  if(!t){ui.serr='Kod okunamadı. Daha yakından, düz açıyla ve iyi ışıkta tekrar çek.';return render()}

  case 'export':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='fitness-koc-'+todayISO()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);return}
  case 'reset':if(!ui.reset){ui.reset=true;break}localStorage.removeItem('fk');location.reload();return;
 }
 render()});

 if(d.w){if(d.w.startsWith('lifts.'))S.wiz.lifts[d.w.split('.')[1]]=el.value;else S.wiz[d.w]=el.value;save();return}

  const b=document.getElementById('adh');if(b)b.textContent=adh(session(label,dt),dr);save();return}
 if(d.dr){const p=d.dr.split('|'),f=p.pop(),key=p.join('|');S.draft[key]=S.draft[key]||{sets:{},dur:'',rpe:'8'};S.draft[key][f]=el.value;save();return}
 if(d.m){ui.m=ui.m||{};ui.m[d.m]=el.value;return}
 if(d.cfg){S.cfg[d.cfg]=el.value.replace(/\s+/g,'');save();return}
 if(d.pf){S.profile=S.profile||{};S.profile[d.pf]=el.value;save();return}});
